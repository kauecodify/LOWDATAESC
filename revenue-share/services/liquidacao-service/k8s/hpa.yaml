apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: liquidacao-service-hpa
  namespace: revenue-share
  labels:
    app: liquidacao-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production
  annotations:
    description: "Horizontal Pod Autoscaler for Revenue Share Liquidação Service"
    maintainer: "Revenue Share Team"

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: liquidacao-service
  
  minReplicas: 3
  maxReplicas: 20
  
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom metrics from Prometheus
    - type: Pods
      pods:
        metric:
          name: settlement_processing_rate
        selector:
          matchLabels:
            app: liquidacao-service
        target:
          type: AverageValue
          averageValue: 100
    
    - type: Pods
      pods:
        metric:
          name: settlement_queue_size
        selector:
          matchLabels:
            app: liquidacao-service
        target:
          type: AverageValue
          averageValue: 500
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    
    scaleUp:
      stabilizationWindowSeconds: 60  # 1 minute
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
        - type: Pods
          value: 5
          periodSeconds: 60
      selectPolicy: Max
