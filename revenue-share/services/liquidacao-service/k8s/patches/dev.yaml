apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidacao-service
  namespace: revenue-share

spec:
  replicas: 1
  
  template:
    spec:
      containers:
        - name: liquidacao-service
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          
          env:
            - name: NODE_ENV
              value: "development"
            - name: LOG_LEVEL
              value: "debug"
            - name: DB_SSL
              value: "false"
            - name: KAFKA_SSL
              value: "false"
            - name: LOWDATAESC_SSL
              value: "false"
            - name: MTLS_ENABLED
              value: "false"
