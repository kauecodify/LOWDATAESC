apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidacao-service
  namespace: revenue-share

spec:
  replicas: 2
  
  template:
    spec:
      containers:
        - name: liquidacao-service
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          env:
            - name: NODE_ENV
              value: "staging"
            - name: LOG_LEVEL
              value: "info"
            - name: DB_SSL
              value: "true"
            - name: KAFKA_SSL
              value: "true"
            - name: LOWDATAESC_SSL
              value: "true"
            - name: MTLS_ENABLED
              value: "true"
