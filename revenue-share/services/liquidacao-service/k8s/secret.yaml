apiVersion: v1
kind: Secret
metadata:
  name: liquidacao-service-secrets
  namespace: revenue-share
  labels:
    app: liquidacao-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production
  annotations:
    description: "Secrets for Revenue Share Liquidação Service"
    maintainer: "Revenue Share Team"
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "revenue-share-liquidacao"
    vault.hashicorp.com/agent-inject-template: "true"

_type: Opaque

stringData:
  # Database credentials
  DB_USERNAME: "revenue_liquidacao_user"
  DB_PASSWORD: "{{ .Vault.DB_PASSWORD }}"
  
  # Kafka credentials
  KAFKA_USERNAME: "revenue-liquidacao"
  KAFKA_PASSWORD: "{{ .Vault.KAFKA_PASSWORD }}"
  
  # Redis credentials
  REDIS_PASSWORD: "{{ .Vault.REDIS_PASSWORD }}"
  
  # JWT secret
  JWT_SECRET: "{{ .Vault.JWT_SECRET }}"
  
  # mTLS certificates and keys (base64 encoded)
  MTLS_CERT: "{{ .Vault.MTLS_CERT }}"
  MTLS_KEY: "{{ .Vault.MTLS_KEY }}"
  MTLS_CA: "{{ .Vault.MTLS_CA }}"
  
  # LOWDATAESC gRPC certificates
  LOWDATAESC_CLIENT_CERT: "{{ .Vault.LOWDATAESC_CLIENT_CERT }}"
  LOWDATAESC_CLIENT_KEY: "{{ .Vault.LOWDATAESC_CLIENT_KEY }}"
  LOWDATAESC_CA_CERT: "{{ .Vault.LOWDATAESC_CA_CERT }}"
  
  # API keys for external services
  LOWDATAESC_API_KEY: "{{ .Vault.LOWDATAESC_API_KEY }}"
  
  # Encryption keys
  ENCRYPTION_KEY: "{{ .Vault.ENCRYPTION_KEY }}"
  
  # Service account tokens (for inter-service communication)
  SERVICE_ACCOUNT_TOKEN: "{{ .Vault.SERVICE_ACCOUNT_TOKEN }}"

---
# Separate secret for mTLS certificates
apiVersion: v1
kind: Secret
metadata:
  name: liquidacao-service-certs
  namespace: revenue-share
  labels:
    app: liquidacao-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production
  annotations:
    description: "mTLS certificates for Revenue Share Liquidação Service"
    maintainer: "Revenue Share Team"
    cert-manager.io/alt-name: "liquidacao-service.revenue-share.svc.cluster.local"
    cert-manager.io/ip-sans: ""
    cert-manager.io/issuer: "revenue-share-ca"

_type: kubernetes.io/tls

stringData:
  tls.crt: "{{ .Vault.TLS_CERT }}"
  tls.key: "{{ .Vault.TLS_KEY }}"
  ca.crt: "{{ .Vault.CA_CERT }}"

---
# Separate secret for LOWDATAESC gRPC certificates
apiVersion: v1
kind: Secret
metadata:
  name: lowdataesc-grpc-certs
  namespace: revenue-share
  labels:
    app: liquidacao-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production
  annotations:
    description: "gRPC certificates for LOWDATAESC integration"
    maintainer: "Revenue Share Team"

_type: Opaque

stringData:
  ca.crt: "{{ .Vault.LOWDATAESC_CA_CERT }}"
  client.crt: "{{ .Vault.LOWDATAESC_CLIENT_CERT }}"
  client.key: "{{ .Vault.LOWDATAESC_CLIENT_KEY }}"
  server.crt: "{{ .Vault.LOWDATAESC_SERVER_CERT }}"
  server.key: "{{ .Vault.LOWDATAESC_SERVER_KEY }}"
