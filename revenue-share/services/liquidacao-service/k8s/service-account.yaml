apiVersion: v1
kind: ServiceAccount
metadata:
  name: liquidacao-service
  namespace: revenue-share
  labels:
    app: liquidacao-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production
  annotations:
    description: "Service Account for Revenue Share Liquidação Service"
    maintainer: "Revenue Share Team"
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/revenue-share-liquidacao-role"

---
# Role for the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: liquidacao-service-role
  namespace: revenue-share
  labels:
    app: liquidacao-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production

rules:
  # Pod management
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  
  # ConfigMap and Secret access
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  
  # Service discovery
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  
  # Custom resources
  - apiGroups: ["revenue-share.company.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: liquidacao-service-role-binding
  namespace: revenue-share
  labels:
    app: liquidacao-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production

subjects:
  - kind: ServiceAccount
    name: liquidacao-service
    namespace: revenue-share

roleRef:
  kind: Role
  name: liquidacao-service-role
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole for cross-namespace access (if needed)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: liquidacao-service-cluster-role
  labels:
    app: liquidacao-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production

rules:
  # Read access to other namespaces
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  
  # Read access to ConfigMaps and Secrets in other namespaces
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames:
      - "lowdataesc-service-config"
      - "lowdataesc-service-secrets"
      - "kafka-config"
      - "postgres-config"
    verbs: ["get"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: liquidacao-service-cluster-role-binding
  labels:
    app: liquidacao-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production

subjects:
  - kind: ServiceAccount
    name: liquidacao-service
    namespace: revenue-share

roleRef:
  kind: ClusterRole
  name: liquidacao-service-cluster-role
  apiGroup: rbac.authorization.k8s.io
