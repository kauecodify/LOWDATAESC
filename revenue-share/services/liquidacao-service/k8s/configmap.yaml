apiVersion: v1
kind: ConfigMap
metadata:
  name: liquidacao-service-config
  namespace: revenue-share
  labels:
    app: liquidacao-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production
  annotations:
    description: "Configuration for Revenue Share Liquidação Service"
    maintainer: "Revenue Share Team"

_data:
  # Service configuration
  SERVICE_NAME: "liquidacao-service"
  SERVICE_VERSION: "1.0.0"
  NODE_ENV: "production"
  PORT: "8443"
  ALLOWED_ORIGINS: "*"
  
  # Database configuration (PostgreSQL)
  DB_HOST: "postgres.revenue-share.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "revenue_share"
  DB_SCHEMA: "liquidacao"
  DB_SSL: "true"
  DB_SYNC: "false"
  DB_POOL_SIZE: "20"
  DB_MAX_POOL_SIZE: "50"
  DB_POOL_TIMEOUT: "5000"
  DB_CONNECTION_TIMEOUT: "10000"
  DB_IDLE_TIMEOUT: "30000"
  
  # Kafka configuration
  KAFKA_BROKERS: "kafka.revenue-share.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "liquidacao-service"
  KAFKA_GROUP_ID: "liquidacao-service-group"
  KAFKA_TOPIC_SETTLEMENT_INSTRUCTIONS: "settlement-instructions"
  KAFKA_TOPIC_SETTLEMENT_RESULTS: "settlement-results"
  KAFKA_SSL: "true"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_RETRIES: "5"
  KAFKA_RETRY_DELAY: "1000"
  KAFKA_MAX_MESSAGE_BYTES: "10485760"  # 10MB
  
  # Redis configuration (for idempotency)
  REDIS_HOST: "redis.revenue-share.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "0"
  IDEMPOTENCY_TTL: "86400"  # 24 hours
  REDIS_CONNECTION_TIMEOUT: "5000"
  REDIS_RETRY_STRATEGY: "exponential"
  
  # LOWDATAESC gRPC configuration
  LOWDATAESC_HOST: "lowdataesc-service.revenue-share.svc.cluster.local"
  LOWDATAESC_PORT: "50051"
  LOWDATAESC_SSL: "true"
  LOWDATAESC_CERT_PATH: "/app/certs/grpc/ca.crt"
  LOWDATAESC_CONNECTION_TIMEOUT: "10000"
  LOWDATAESC_RETRY_DELAY: "1000"
  LOWDATAESC_MAX_RETRIES: "3"
  
  # Settlement configuration
  SETTLEMENT_MAX_RETRIES: "5"
  SETTLEMENT_RETRY_DELAY: "1000"
  SETTLEMENT_TIMEOUT: "30000"
  SETTLEMENT_DEFAULT_CURRENCY: "BRL"
  SETTLEMENT_BATCH_SIZE: "100"
  SETTLEMENT_PROCESSING_DELAY: "0"  # 0 = immediate, in ms
  
  # Logging configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_MAX_FILES: "10"
  LOG_MAX_SIZE: "100"
  LOG_DIR: "/app/logs"
  
  # Metrics configuration
  METRICS_ENABLED: "true"
  METRICS_PORT: "8080"
  METRICS_PATH: "/metrics"
  
  # Health check configuration
  HEALTH_CHECK_INTERVAL: "30000"
  HEALTH_CHECK_TIMEOUT: "5000"
  
  # Security configuration
  MTLS_ENABLED: "true"
  MTLS_CERT_PATH: "/app/certs/server.crt"
  MTLS_KEY_PATH: "/app/certs/server.key"
  MTLS_CA_PATH: "/app/certs/ca.crt"
  JWT_SECRET: ""
  JWT_EXPIRES_IN: "1h"
  
  # Rate limiting configuration
  RATE_LIMIT_WINDOW: "60000"  # 1 minute
  RATE_LIMIT_MAX: "1000"  # requests per window
  RATE_LIMIT_MESSAGE: "Too many requests, please try again later"
  
  # Circuit breaker configuration
  CIRCUIT_BREAKER_ENABLED: "true"
  CIRCUIT_BREAKER_THRESHOLD: "5"  # failures before opening
  CIRCUIT_BREAKER_RESET_TIMEOUT: "30000"  # 30 seconds
  
  # Feature flags
  FEATURE_GRPC_ENABLED: "true"
  FEATURE_KAFKA_ENABLED: "true"
  FEATURE_IDEMPOTENCY_ENABLED: "true"
  FEATURE_HASH_CHAIN_ENABLED: "true"
  FEATURE_RETRY_ENABLED: "true"
  
  # Internationalization
  DEFAULT_LOCALE: "pt-BR"
  SUPPORTED_LOCALES: "pt-BR,en-US,es-ES"
  
  # Timezone
  TZ: "America/Sao_Paulo"
