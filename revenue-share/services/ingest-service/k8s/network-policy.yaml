apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest-service-allow-kafka
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Allow Ingest Service to communicate with Kafka"
    
spec:
  podSelector:
    matchLabels:
      app: ingest-service
  
  policyTypes:
    - Egress
  
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kafka
          podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093

