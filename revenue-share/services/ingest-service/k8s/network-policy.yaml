apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest-service-allow-internal
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Allow Ingest Service to communicate with other Revenue Share services"
    
spec:
  podSelector:
    matchLabels:
      app: ingest-service
  
  policyTypes:
    - Egress
    - Ingress
  
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: revenue-share
          podSelector:
            matchLabels:
              service: revenue-share
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080
  
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: revenue-share
          podSelector:
            matchLabels:
              service: revenue-share
      ports:
        - protocol: TCP
          port: 8443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest-service-allow-monitoring
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Allow monitoring tools to scrape Ingest Service metrics"
    
spec:
  podSelector:
    matchLabels:
      app: ingest-service
  
  policyTypes:
    - Ingress
  
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
    
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest-service-deny-all-other
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Deny all other traffic to Ingest Service (Zero Trust)"
    
spec:
  podSelector:
    matchLabels:
      app: ingest-service
  
  policyTypes:
    - Ingress
    - Egress
  
  # Empty ingress and egress means deny all
  ingress: []
  egress: []
