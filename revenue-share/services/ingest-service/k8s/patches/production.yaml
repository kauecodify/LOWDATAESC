apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
  namespace: revenue-share
spec:
  replicas: 5
  template:
    spec:
      containers:
        - name: ingest-service
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_SSL
              value: "true"
            - name: KAFKA_SSL
              value: "true"
            - name: MTLS_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: "info"
