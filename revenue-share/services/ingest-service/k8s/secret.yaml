apiVersion: v1
kind: Secret
metadata:
  name: ingest-service-secrets
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Secrets for Revenue Share Ingest Service"
    kubernetes.io/created-by: "revenue-share-admin"
    
type: Opaque

stringData:
  # Database Secrets
  DB_PASSWORD: "CHANGE_ME_revenue_db_password_2024"
  
  # Kafka SASL Secrets
  KAFKA_SASL_USERNAME: "ingest-service-user"
  KAFKA_SASL_PASSWORD: "CHANGE_ME_kafka_password_2024"
  
  # Redis Secrets
  REDIS_PASSWORD: "CHANGE_ME_redis_password_2024"
  
  # JWT Secrets
  JWT_SECRET: "CHANGE_ME_jwt_secret_key_256_bits_minimum_2024"
  JWT_EXPIRES_IN: "1h"
  
  # API Keys (for external integrations)
  API_KEY: "CHANGE_ME_api_key_for_ingest_service"
  
  # Encryption Keys
  ENCRYPTION_KEY: "CHANGE_ME_32_byte_encryption_key_base64"
  
  # Service Account Tokens
  SERVICE_ACCOUNT_TOKEN: "CHANGE_ME_service_account_token"

---
apiVersion: v1
kind: Secret
metadata:
  name: ingest-service-certs
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "TLS Certificates for Revenue Share Ingest Service"
    kubernetes.io/created-by: "revenue-share-admin"
    
type: kubernetes.io/tls

stringData:
  # mTLS Certificates
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGE_ME_client_certificate_base64_encoded
    -----END CERTIFICATE-----
  
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME_client_private_key_base64_encoded
    -----END PRIVATE KEY-----
  
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGE_ME_ca_certificate_base64_encoded
    -----END CERTIFICATE-----

---
apiVersion: v1
kind: Secret
metadata:
  name: ingest-service-database-secrets
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Database-specific secrets for Revenue Share Ingest Service"
    
type: Opaque

stringData:
  # Database connection string
  DATABASE_URL: "postgresql://revenue_user:CHANGE_ME_revenue_db_password_2024@postgres.revenue-share.svc.cluster.local:5432/revenue_share?sslmode=require"
  
  # Read replica connection strings
  DATABASE_READ_URL: "postgresql://revenue_user:CHANGE_ME_revenue_db_password_2024@postgres-read.revenue-share.svc.cluster.local:5432/revenue_share?sslmode=require"
