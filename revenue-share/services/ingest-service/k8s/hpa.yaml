apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingest-service-hpa
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Horizontal Pod Autoscaler for Revenue Share Ingest Service"
    
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingest-service
  
  minReplicas: 3
  maxReplicas: 20
  
  metrics:
    # CPU Utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory Utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom Metric: Kafka Lag
    - type: External
      external:
        metric:
          name: kafka_consumergroup_lag
          selector:
            matchLabels:
              consumergroup: ingest-service-group
              topic: revenue-events
        target:
          type: AverageValue
          averageValue: 1000
    
    # Custom Metric: Request Rate
    - type: External
      external:
        metric:
          name: http_requests_per_second
          selector:
            matchLabels:
              service: ingest-service
        target:
          type: AverageValue
          averageValue: 1000
    
    # Custom Metric: p99 Latency
    - type: External
      external:
        metric:
          name: http_request_duration_seconds
          selector:
            matchLabels:
              service: ingest-service
              quantile: "0.99"
        target:
          type: AverageValue
          averageValue: 100
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Max
    
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
        - type: Pods
          value: 5
          periodSeconds: 60
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingest-service-hpa-low-latency
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    low-latency: "true"
  annotations:
    description: "Low Latency Horizontal Pod Autoscaler for Revenue Share Ingest Service"
    
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingest-service
  
  minReplicas: 5
  maxReplicas: 50
  
  metrics:
    # Low Latency Mode
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    
    # Custom Metric: p99 Latency (strict)
    - type: External
      external:
        metric:
          name: http_request_duration_seconds
          selector:
            matchLabels:
              service: ingest-service
              quantile: "0.99"
        target:
          type: AverageValue
          averageValue: 50
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 5
          periodSeconds: 60
      selectPolicy: Max
    
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
        - type: Pods
          value: 10
          periodSeconds: 15
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: VerticalPodAutoscaler
metadata:
  name: ingest-service-vpa
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Vertical Pod Autoscaler for Revenue Share Ingest Service"
    
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingest-service
  
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 3
  
  resourcePolicy:
    containerPolicies:
      - containerName: ingest-service
        minAllowed:
          cpu: "100m"
          memory: "256Mi"
        maxAllowed:
          cpu: "2"
          memory: "4Gi"
        controlledResources: ["cpu", "memory"]
