apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-service-config
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Configuration for Revenue Share Ingest Service"
    
data:
  # Service Configuration
  SERVICE_NAME: "ingest-service"
  SERVICE_VERSION: "1.0.0"
  NODE_ENV: "production"
  PORT: "8443"
  HOST: "0.0.0.0"
  
  # Database Configuration
  DB_HOST: "postgres.revenue-share.svc.cluster.local"
  DB_PORT: "5432"
  DB_USERNAME: "revenue_user"
  DB_NAME: "revenue_share"
  DB_SCHEMA: "ingest"
  DB_SSL: "true"
  DB_SYNC: "false"
  DB_MIGRATIONS: "false"
  DB_LOGGING: "false"
  DB_POOL_SIZE: "20"
  DB_TIMEOUT: "5000"
  
  # Kafka Configuration
  KAFKA_BROKERS: "kafka-0.kafka.revenue-share.svc.cluster.local:9092,kafka-1.kafka.revenue-share.svc.cluster.local:9092,kafka-2.kafka.revenue-share.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "ingest-service"
  KAFKA_GROUP_ID: "ingest-service-group"
  KAFKA_TOPIC_REVENUE_EVENTS: "revenue-events"
  KAFKA_TOPIC_DEAD_LETTER: "revenue-events-dlq"
  KAFKA_SSL: "true"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  KAFKA_RETRIES: "5"
  KAFKA_RETRY_DELAY: "1000"
  
  # Redis Configuration
  REDIS_HOST: "redis.revenue-share.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # Idempotency Configuration
  IDEMPOTENCY_ENABLED: "true"
  IDEMPOTENCY_TTL: "86400"
  IDEMPOTENCY_HEADER: "Idempotency-Key"
  
  # Security Configuration
  MTLS_ENABLED: "true"
  MTLS_CERT_PATH: "/certs/tls.crt"
  MTLS_KEY_PATH: "/certs/tls.key"
  MTLS_CA_PATH: "/certs/ca.crt"
  
  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "1000"
  
  # Health Check Configuration
  HEALTH_LIVENESS_PATH: "/api/v1/health/liveness"
  HEALTH_READINESS_PATH: "/api/v1/health/readiness"
  HEALTH_TIMEOUT: "5000"
  
  # Logging Configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_MAX_FILES: "10"
  LOG_MAX_SIZE: "100m"
  LOG_DIR: "/app/logs"
  
  # Circuit Breaker Configuration
  CIRCUIT_BREAKER_ENABLED: "true"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_SUCCESS_THRESHOLD: "2"
  CIRCUIT_BREAKER_TIMEOUT: "10000"
  CIRCUIT_BREAKER_RESET_TIMEOUT: "30000"
  
  # Allowed Origins (CORS)
  ALLOWED_ORIGINS: "https://revenue-share.company.com,https://admin.revenue-share.company.com"
  
  # TR8 Compliance Flags
  TR8_AVAILABILITY_TARGET: "99.95"
  TR8_LATENCY_TARGET_MS: "100"
  TR8_TPS_TARGET: "5000"
  TR8_RPO_MINUTES: "5"
  TR8_RTO_MINUTES: "15"
  
  # Performance Tuning
  UV_THREADPOOL_SIZE: "16"
  NODE_OPTIONS: "--max-old-space-size=4096 --gc-interval=100"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-service-monitoring
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: monitoring
    version: v1.0.0
  annotations:
    description: "Monitoring configuration for Revenue Share Ingest Service"
    
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'ingest-service'
        scrape_interval: 10s
        metrics_path: '/api/v1/health/metrics'
        static_configs:
          - targets: ['ingest-service.revenue-share.svc.cluster.local:8443']
        tls_config:
          insecure_skip_verify: true
    
  alert.rules: |
    groups:
      - name: ingest-service-alerts
        rules:
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[1m]) / rate(http_requests_total[1m]) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate on Ingest Service"
              description: "Error rate is {{ $value }}%"
          
          - alert: HighLatency
            expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High latency on Ingest Service"
              description: "99th percentile latency is {{ $value }}s"
          
          - alert: LowAvailability
            expr: sum(up{job="ingest-service"}) by (job) < 3
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Low availability on Ingest Service"
              description: "Only {{ $value }} instances are running"
