apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest-service
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Service Account for Revenue Share Ingest Service"
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/ingest-service-role"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingest-service-role
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "RBAC Role for Revenue Share Ingest Service"

rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingest-service-role-binding
  namespace: revenue-share
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "RBAC Role Binding for Revenue Share Ingest Service"

subjects:
  - kind: ServiceAccount
    name: ingest-service
    namespace: revenue-share

roleRef:
  kind: Role
  name: ingest-service-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingest-service-cluster-role
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Cluster Role for Revenue Share Ingest Service"

rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingest-service-cluster-role-binding
  labels:
    app: ingest-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Cluster Role Binding for Revenue Share Ingest Service"

subjects:
  - kind: ServiceAccount
    name: ingest-service
    namespace: revenue-share

roleRef:
  kind: ClusterRole
  name: ingest-service-cluster-role
  apiGroup: rbac.authorization.k8s.io
