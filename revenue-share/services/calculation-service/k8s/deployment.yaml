apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculation-service
  namespace: revenue-share
  labels:
    app: calculation-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production
  annotations:
    description: "Revenue Share Calculation Service - TR8 Standard"
    maintainer: "Revenue Share Team"
    support: "revenue-share@company.com"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8444"
    prometheus.io/path: "/metrics"
    
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: calculation-service
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 15%
  
  template:
    metadata:
      labels:
        app: calculation-service
        service: revenue-share
        tier: backend
        version: v1.0.0
        tr8-compliant: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8444"
        prometheus.io/path: "/api/v1/health"
    
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1002
        runAsGroup: 1002
        fsGroup: 1002
        seccompProfile:
          type: RuntimeDefault
      
      serviceAccountName: calculation-service
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - calculation-service
                topologyKey: kubernetes.io/hostname
      
      nodeSelector:
        nodegroup: backend
        dedicated: revenue-share
      
      tolerations:
        - key: dedicated
          operator: Equal
          value: revenue-share
          effect: NoSchedule
      
      containers:
        - name: calculation-service
          image: registry.company.com/revenue-share/calculation-service:v1.0.0
          imagePullPolicy: IfNotPresent
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          
          ports:
            - name: http
              containerPort: 8444
              protocol: TCP
            - name: metrics
              containerPort: 8081
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: calculation-service-config
            - secretRef:
                name: calculation-service-secrets
          
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: 8444
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: 8444
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: 8444
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /app/tmp
          
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15 && echo 'Graceful shutdown complete'"]
      
      volumes:
        - name: certs
          secret:
            secretName: calculation-service-certs
            defaultMode: 0644
        - name: logs
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
      
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "5"
      
      terminationGracePeriodSeconds: 60
