apiVersion: apps/v1
kind: Deployment
metadata:
  name: split-payment-service
  namespace: revenue-share
  labels:
    app: split-payment-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
    environment: production
  annotations:
    description: "Split Payment Service for LOWDATAESC - CBS/IBS Tax Split with BACEN Integration"
    maintainer: "LOWDATAESC Team"
    support: "split-payment@lowdataesc.gov.br"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8446"
    prometheus.io/path: "/api/v1/health"
    
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: split-payment-service
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 15%
  
  template:
    metadata:
      labels:
        app: split-payment-service
        service: revenue-share
        tier: backend
        version: v1.0.0
        tr8-compliant: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8446"
        prometheus.io/path: "/api/v1/health"
    
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      
      serviceAccountName: split-payment-service
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - split-payment-service
                topologyKey: kubernetes.io/hostname
      
      nodeSelector:
        nodegroup: backend
        dedicated: revenue-share
      
      tolerations:
        - key: dedicated
          operator: Equal
          value: revenue-share
          effect: NoSchedule
      
      containers:
        - name: split-payment-service
          image: registry.company.com/revenue-share/split-payment-service:v1.0.0
          imagePullPolicy: IfNotPresent
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          
          ports:
            - name: http
              containerPort: 8446
              protocol: TCP
            - name: grpc
              containerPort: 50053
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: split-payment-service-config
            - secretRef:
                name: split-payment-service-secret
          
          env:
            - name: NODE_ENV
              value: "production"
            - name: SERVICE_NAME
              value: "split-payment-service"
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: PORT
              value: "8446"
            - name: GRPC_SERVER_PORT
              value: "50053"
            - name: DB_SCHEMA
              value: "split_payments"
            - name: KAFKA_GROUP_ID
              value: "split-payment-service-group"
            - name: KAFKA_CLIENT_ID
              value: "split-payment-service"
          
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8446
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8446
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      
      volumes:
        - name: certs
          secret:
            secretName: split-payment-service-certs
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
