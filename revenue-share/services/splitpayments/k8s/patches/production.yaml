apiVersion: apps/v1
kind: Deployment
metadata:
  name: split-payment-service
  namespace: revenue-share
spec:
  replicas: 5
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 10%
  template:
    spec:
      containers:
        - name: split-payment-service
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: DB_LOGGING
              value: "false"
