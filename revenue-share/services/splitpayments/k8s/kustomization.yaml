apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
  - service-account.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml
  - configmap.yaml
  - secret.yaml

namespace: revenue-share

commonLabels:
  app: split-payment-service
  service: revenue-share
  tier: backend
  version: v1.0.0
  tr8-compliant: "true"

configMapGenerator:
  - name: split-payment-service-config
    behavior: replace
    files:
      - configmap.yaml

secretGenerator:
  - name: split-payment-service-secret
    behavior: replace
    files:
      - secret.yaml

patches:
  - path: patches/production.yaml
    target:
      kind: Deployment
      name: split-payment-service
  - path: patches/development.yaml
    target:
      kind: Deployment
      name: split-payment-service
