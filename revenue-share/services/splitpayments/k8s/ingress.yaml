apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: split-payment-service
  namespace: revenue-share
  labels:
    app: split-payment-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Ingress for Split Payment Service"
    maintainer: "LOWDATAESC Team"
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/client-max-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self';" always;

spec:
  tls:
    - hosts:
        - split-payment.lowdataesc.company.com
      secretName: split-payment-service-tls
  
  rules:
    - host: split-payment.lowdataesc.company.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: split-payment-service
                port:
                  number: 8446
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: split-payment-service
                port:
                  number: 8446
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: split-payment-service
                port:
                  number: 8446
