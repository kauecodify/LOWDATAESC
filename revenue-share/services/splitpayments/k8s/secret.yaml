apiVersion: v1
kind: Secret
metadata:
  name: split-payment-service-secret
  namespace: revenue-share
  labels:
    app: split-payment-service
    service: revenue-share
    tier: backend
    version: v1.0.0
    tr8-compliant: "true"
  annotations:
    description: "Secrets for Split Payment Service"
    maintainer: "LOWDATAESC Team"
type: Opaque
stringData:
  # Database secrets
  DB_USERNAME: "split_user"
  DB_PASSWORD: "split_pass"

  # Kafka secrets
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  KAFKA_SASL_USERNAME: "split-payment-user"
  KAFKA_SASL_PASSWORD: "split-payment-password"

  # Redis secrets
  REDIS_PASSWORD: ""

  # Security secrets
  JWT_SECRET: ""
  ENCRYPTION_KEY: ""

  # BACEN secrets
  BACEN_API_KEY: ""
  BACEN_CLIENT_ID: ""
  BACEN_CLIENT_SECRET: ""

  # Payment Gateway secrets
  IUGU_API_KEY: ""
  IUGU_ACCOUNT_ID: ""
  IUGU_WEBHOOK_TOKEN: ""

  ASAAS_API_KEY: ""
  ASAAS_WEBHOOK_TOKEN: ""

  EFI_API_KEY: ""
  EFI_CLIENT_ID: ""
  EFI_CLIENT_SECRET: ""
  EFI_WEBHOOK_TOKEN: ""

  # Webhook secrets
  RF_WEBHOOK_API_KEY: ""
  LOWDATAESC_API_KEY: ""

  # SPED webhook secret
  SPED_WEBHOOK_URL: ""

  # Internal webhook secrets
  INTERNAL_WEBHOOK_SECRET: ""

  # gRPC certificates
  MTLS_CERT_PATH: "/certs/tls.crt"
  MTLS_KEY_PATH: "/certs/tls.key"
  MTLS_CA_PATH: "/certs/ca.crt"
  LOWDATAESC_GRPC_CA_PATH: "/certs/lowdataesc-ca.crt"
  LOWDATAESC_GRPC_CERT_PATH: "/certs/split-payment-service.crt"
  LOWDATAESC_GRPC_KEY_PATH: "/certs/split-payment-service.key"
